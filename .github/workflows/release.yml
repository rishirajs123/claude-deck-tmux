name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Build binaries + checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -ldflags "-X main.version=$VERSION" -o dist/claude-deck .
            tar -czf "dist/claude-deck-darwin-${arch}.tar.gz" -C dist claude-deck
            rm dist/claude-deck
          done
          cd dist && shasum -a 256 *.tar.gz > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
